<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Katalog Jasa & Booking - Demo Service</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-gray-100 text-gray-800 pb-24 font-sans flex justify-center">

  <!-- KONTAINER UTAMA (W100% DI HP, MAKSIMAL LEBAR SEPERTI APLIKASI DI LAPTOP) -->
  <div class="w-full max-w-md bg-white min-h-screen shadow-xl flex flex-col justify-between relative">
    
    <div>
      <!-- 1. HEADER TIDAK FULL (DALAM BENTUK BOX) -->
      <header class="p-4">
        <div class="bg-gradient-to-r from-blue-600 to-indigo-600 text-white rounded-2xl p-4 shadow-md flex items-center space-x-3">
          <div class="w-12 h-12 bg-white/20 rounded-xl flex items-center justify-center text-white font-bold text-xl border border-white/20 shrink-0">
            🛠️
          </div>
          <div class="min-w-0 flex-1">
            <h1 class="font-bold text-base leading-tight truncate">ProService Malang</h1>
            <p class="text-[11px] text-blue-100 truncate">Spesialis Servis AC & Panggilan Rumah</p>
            <div class="flex items-center space-x-1.5 mt-1.5 text-[9px] font-semibold text-blue-900">
              <span class="bg-blue-100 px-1.5 py-0.5 rounded">Bergaransi</span>
              <span class="bg-blue-100 px-1.5 py-0.5 rounded">Teknisi Ahli</span>
              <span class="bg-blue-100 px-1.5 py-0.5 rounded">Respon Cepat</span>
            </div>
          </div>
        </div>
      </header>

      <!-- 2. DAFTAR LAYANAN JASA -->
      <main class="p-4 space-y-3">
        <div class="flex justify-between items-center px-1">
          <h2 class="font-bold text-xs text-gray-700 uppercase tracking-wider">Pilih Layanan Jasa</h2>
          <span class="text-[10px] text-gray-400">Panggil ke Lokasi</span>
        </div>

        <!-- Container Daftar Layanan (Render via JS) -->
        <div id="service-list" class="space-y-3">
          <!-- Item jasa dimasukkan lewat JavaScript -->
        </div>
      </main>
    </div>

    <!-- 3. FOOTER DALAM BOX -->
    <footer class="px-4 py-4 text-center text-xs text-gray-500 space-y-1.5 border-t mt-6 bg-gray-50 rounded-b-none">
      <div class="font-medium text-gray-700 text-[11px]">
        <p>🕒 Jam Operasional: Senin - Minggu (08.00 - 17.00 WIB)</p>
        <p class="mt-0.5">📍 Cakupan: Malang Kota & Kabupaten</p>
      </div>
      
      <div class="pt-1.5 border-t border-dashed border-gray-200">
        <p class="text-[10px]">&copy; 2026 ProService Malang. All
